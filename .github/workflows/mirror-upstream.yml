name: Mirror upstream picoParkClone

on:
  push:
    branches:
      - mirror-upstream

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tiny Park
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror upstream repository exactly
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/aeolus-1/picoParkClone.git /tmp/picoParkClone
          UPSTREAM_SHA="$(git -C /tmp/picoParkClone rev-parse HEAD)"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git/' /tmp/picoParkClone/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror aeolus-1/picoParkClone ${UPSTREAM_SHA}"
          git push origin HEAD:main
